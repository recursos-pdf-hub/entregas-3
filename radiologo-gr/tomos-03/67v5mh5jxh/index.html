<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="noindex,nofollow" name="robots"/>
<title>Τόμος 03 · Αξονική Τομογραφία (ΑΤ) · Η Βίβλος του Ακτινολόγου</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&amp;family=Source+Serif+4:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
:root{--bg:#EEF3F8;--paper:#FFFFFF;--ink:#0B1E36;--ink-soft:#4A5D75;--accent:#D9962B;--accent-dark:#2F5F8F;--line:#C9DAEC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'IBM Plex Sans',-apple-system,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.top{background:var(--accent-dark);color:var(--paper);text-align:center;padding:11px 16px;font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.head{text-align:center;margin-bottom:22px}
.kicker{display:inline-block;background:var(--accent);color:var(--paper);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
h1{font-family:'Source Serif 4',Georgia,serif;font-size:clamp(26px,5vw,40px);line-height:1.15;margin-bottom:10px}
.sub{color:var(--ink-soft);font-size:17px;max-width:640px;margin:0 auto 20px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:12px;font-weight:800;font-size:16px;text-decoration:none;border:2px solid transparent}
.btn.primary{background:var(--accent);color:var(--paper);box-shadow:0 4px 0 var(--accent-dark)}
.btn.ghost{color:var(--accent-dark);border-color:var(--line);background:var(--paper)}
.viewer{margin-top:22px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.viewer iframe{display:block;width:100%;height:75vh;min-height:520px;border:0}
.meta{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:14px}
.meta b{color:var(--ink)}
.foot{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:28px}
@media (max-width:600px){.btn{width:100%}.viewer iframe{height:70vh}}
</style>
</head>
<body>
<div class="top">Η Βίβλος του Ακτινολόγου</div>
<main class="wrap">
<div class="head">
<span class="kicker">Τόμος 03</span>
<h1>Τόμος 03 · Αξονική Τομογραφία (ΑΤ)</h1>
<p class="sub">HU, παράθυρα, φάσεις σκιαγραφικού και ανάγνωση ΑΤ χωρίς να χάνεστε στην εφημερία.</p>
<div class="actions">
<a class="btn primary" download="" href="tomos-03.pdf">Λήψη PDF</a>
<a class="btn ghost" href="tomos-03.pdf" rel="noopener" target="_blank">Άνοιγμα σε νέα καρτέλα</a>
</div>
</div>
<div class="viewer">
<iframe src="tomos-03.pdf#view=FitH" title="Τόμος 03 · Αξονική Τομογραφία (ΑΤ)"></iframe>
</div>
<div class="meta">
<div><b>38</b> σελίδες</div>
<div>Ισόβια πρόσβαση</div>
</div>
<p class="foot">Μόνο για προσωπική χρήση. Απαγορεύεται η μεταπώληση και η διανομή.</p>
</main>
</body>
</html>
